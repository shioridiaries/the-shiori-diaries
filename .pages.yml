
media:
  input: media
  output: /media

content:
  - name: posts
    label: My Little Writings
    type: collection
    path: _posts
    view:
      fields: [title, category, date]
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: date
        label: Date
        type: date
        required: true

      - name: category
        label: Section
        type: select
        required: true
        options:
          values:
            - Dear Diary
            - Little Rambles
            - The Writing Nook
            - The Rage Room

      - name: body
        label: Your Writing
        type: rich-text
        required: true
